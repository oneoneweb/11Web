  <!-- ================= BOOT ================= -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const appRoot = document.getElementById("app-root");
      const appLoader = document.getElementById("app-loader");

      let appShown = false;

      function showApp() {
        if (appShown) return;
        appShown = true;

        if (appRoot) {
          appRoot.style.display = "block";
        }

        if (appLoader) {
          appLoader.classList.add("hide");
          setTimeout(() => {
            appLoader.remove();
          }, 300);
        }

        document.body.classList.remove("app-booting");
      }

      function waitForFirstRenderReady() {
        return new Promise((resolve) => {
          let done = false;

          const finish = () => {
            if (done) return;
            done = true;
            window.removeEventListener("APP_FIRST_RENDER_READY", onReady);
            clearTimeout(timer);
            resolve();
          };

          const onReady = () => finish();

          window.addEventListener("APP_FIRST_RENDER_READY", onReady, { once: true });

          const timer = setTimeout(() => {
            finish();
          }, 4500);
        });
      }

      async function boot() {

        console.log("🚀 BOOT START");

        try {

          window.State?.init?.();
          window.Events?.init?.();
          window.Utils?.init?.();

          window.Shell?.init?.();
          window.Topbar?.init?.();
          window.Navbar?.init?.();
          window.Menu?.init?.();

          if (window.Router?.init) {
            window.Router.init();
          }

          await waitForFirstRenderReady();

          showApp();

          console.log("✅ BOOT DONE");

        } catch (e) {
          console.error("❌ BOOT ERROR:", e);
          showApp();
        }
      }

      requestAnimationFrame(() => {
        boot();
      });

    });
  </script>
